# =============================================================================
# Secret — all application configuration (sensitive + non-sensitive)
# =============================================================================
# ⚠️  In production, use Sealed Secrets, SOPS, or External Secrets Operator
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rd.fullname" . }}-secret
  namespace: {{ include "rd.namespace" . }}
  labels:
    {{- include "rd.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Sensitive
  SECRET_KEY: {{ .Values.backend.secrets.SECRET_KEY | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  DATABASE_URL: {{ include "rd.databaseUrl" . | quote }}
  {{- end }}

  # Application config
  {{- range $key, $value := .Values.backend.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

