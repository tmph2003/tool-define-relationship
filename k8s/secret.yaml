# =============================================================================
# Secret — sensitive application data
# =============================================================================
# ⚠️  In production, use a secrets manager (Vault, Sealed Secrets, SOPS, etc.)
#     instead of plain base64-encoded values.
#
# To generate base64 values:
#   echo -n 'your-value' | base64
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: relationship-designer
  labels:
    app.kubernetes.io/name: relationship-designer
    app.kubernetes.io/part-of: relationship-designer
type: Opaque
stringData:
  # PostgreSQL credentials
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"

  # Backend
  SECRET_KEY: "change-me-to-a-random-secret-in-production"
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/relationship_designer"
