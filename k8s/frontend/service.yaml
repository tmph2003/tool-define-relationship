# =============================================================================
# Frontend — Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: relationship-designer
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: relationship-designer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
